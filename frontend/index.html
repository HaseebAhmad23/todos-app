<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen">
      <div class="auth-card">
        <h1>Todo App</h1>
        <p class="subtitle">Sign in or create an account</p>

        <form id="login-form" class="auth-form">
          <h2>Sign in</h2>
          <input type="text" id="login-username" placeholder="Username" required>
          <input type="password" id="login-password" placeholder="Password" required>
          <button type="submit">Sign in</button>
          <p id="login-error" class="error hidden"></p>
        </form>

        <hr>

        <form id="register-form" class="auth-form">
          <h2>Create account</h2>
          <input type="text" id="reg-username" placeholder="Username" required>
          <input type="password" id="reg-password" placeholder="Password" required>
          <button type="submit">Create account</button>
          <p id="reg-error" class="error hidden"></p>
        </form>
      </div>
      <p class="demo-hint">Demo: demo / demo</p>
    </div>

    <!-- Todo Dashboard -->
    <div id="dashboard-screen" class="screen hidden">
      <header class="header">
        <h1>My Todos</h1>
        <div class="header-actions">
          <span id="current-user" class="user-badge"></span>
          <button id="btn-logout">Log out</button>
        </div>
      </header>

      <div class="dashboard">
        <form id="add-todo-form" class="add-form">
          <input type="text" id="todo-title" placeholder="What needs to be done?" required>
          <input type="text" id="todo-desc" placeholder="Description (optional)">
          <button type="submit">Add</button>
        </form>
        <p id="add-error" class="error hidden"></p>

        <ul id="todo-list" class="todo-list"></ul>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
